*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

  background:var(--bg); color:var(--ink);

}

#banner{flex:none;}
#screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 18px 24px; scroll-behavior:smooth;}
#nav{flex:none;}

h2{font-size:20px; font-weight:700; line-height:1.3;}
h3{font-size:17px; font-weight:700;}
.sub{color:var(--ink-2); font-size:15px;}
.small{color:var(--ink-3); font-size:13px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--ink-3);}

.stack-lg{display:flex; flex-direction:column; gap:18px;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

button{font-family:inherit; font-size:16px; cursor:pointer; border:none; background:none; color:inherit; text-align:right;}
.btn{

}
.btn:active{transform:scale(.985);}
.btn-primary{background:var(--blue); color:#fff;}

.btn-ghost{background:var(--surface); color:var(--blue-ink); border:1.5px solid var(--line);}
.btn-quiet{background:none; color:var(--blue-ink); min-height:44px; font-size:15px; width:auto; padding:8px 12px;}
.btn-green{background:var(--green); color:#fff;}
.btn-orange{background:var(--orange); color:#fff;}
.btn-red{background:var(--red); color:#fff;}

.btn[disabled]{opacity:.45; cursor:default;}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{

}

}
input::placeholder,textarea::placeholder{color:var(--ink-3);}
label.fld{display:block; font-size:14px; font-weight:700; color:var(--ink-2); margin-bottom:6px;}

.chip{

.chip.on{background:var(--blue-soft); border-color:var(--blue); color:var(--blue-ink);}
.tag{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700;}
.tag-blue{background:var(--blue-soft); color:var(--blue-ink);}
.tag-green{background:var(--green-soft); color:var(--green-ink);}
.tag-orange{background:var(--orange-soft); color:var(--orange-ink);}
.tag-red{background:var(--red-soft); color:var(--red-ink);}
.tag-gray{background:var(--gray-soft); color:var(--ink-2);}

#nav{

#nav button.on{color:var(--blue-ink);}

.drill-banner{background:var(--orange);}

/* התראות toast */
#toast{

#toast.show{opacity:1; transform:none; pointer-events:auto;}
#toast button{color:#9CC4F5; font-weight:700; font-size:15px; flex:none;}

.center{text-align:center; align-items:center;}
.mt-auto{margin-top:auto;}

@media (prefers-reduced-motion: reduce){

let toastTimer=null, toastUndo=null;
function toast(msg, undoFn){
  const t = document.getElementById('toast');
  toastUndo = undoFn||null;
  t.innerHTML = `<span>${msg}</span>` + (undoFn?`<button onclick="doUndo()">ביטול</button>`:'');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), undoFn?5000:2600);
}
function doUndo(){ if(toastUndo){toastUndo(); toastUndo=null;} document.getElementById('toast').classList.remove('show'); render(); }

function openModal(html){ document.getElementById('modal').innerHTML = '<div class="modal-handle"></div>'+html; document.getElementById('modal-wrap').classList.add('open'); }
function closeModal(){ document.getElementById('modal-wrap').classList.remove('open'); }

function startEmergency(drill){
  closeModal();
  S.mode='emergency'; S.drill=drill; S.emgStart=nowHM(); S.myStatus=null;
  S.aptStatus={}; S.requests=[]; S.updates=[]; S.eventLog=[]; S.summary=null;
  S.tasks = S.tasks.filter(t=>t.kind==='borrow');
  pushUpdate('האירוע נפתח. כל הדיירים מתבקשים לדווח על מצבם במסך הדיווח.');
  logEv('האירוע הופעל');
  go('ereport');
  runSimulation();
}
function pushUpdate(text){ S.updates.unshift({text, time:nowHM()}); }
function logEv(t){ S.eventLog.push({t, time:Date.now()}); }

/* סימולציית "בניין חי" */
function sim(ms, fn){ S.simTimers.push(setTimeout(()=>{ if(S.mode!=='emergency')return; fn(); render(); }, ms)); }
function runSimulation(){
  sim(2500, ()=>{ S.aptStatus[3]='ok'; toast('יוסי אברהם (דירה 3) דיווח: בסדר'); });
  sim(5000, ()=>{ [1,4,10].forEach(n=>S.aptStatus[n]='ok'); });
  sim(8000, ()=>{
    S.aptStatus[6]='help';
    S.requests.unshift({id:S.nextReq++, apt:6, who:'רחל גולן', type:'סיוע פיזי', urg:'בהקדם', urgTag:'tag-orange',
      text:'זקוקה לעזרה לרדת במדרגות — קשיי ניידות. נמצאת לבד בדירה.', status:'התקבלה', assignee:null, time:nowHM()});
    toast('רחל גולן (דירה 6) מבקשת עזרה');
  });
  sim(11000, ()=>{ [2,7,11].forEach(n=>S.aptStatus[n]='ok'); S.aptStatus[12]='away'; });
  sim(14000, ()=>{ S.aptStatus[9]='ok'; S.aptStatus[5]='ok'; pushUpdate('סריקה ראשונית: אין נזק מבני נראה לעין. נא להישאר זמינים לעדכונים.'); });
  sim(18000, ()=>{
    S.tasks.unshift({id:S.nextTask++, kind:'emg', title:'בדיקת דירה 4 — משפחת כהן', sub:'טרם דיווחו. לדפוק בדלת ולוודא שהכול תקין.', status:'open', urgTag:'tag-orange', urg:'בהקדם'});
    S.aptStatus[4]=undefined; delete S.aptStatus[4];
    toast('קיבלתם משימה: בדיקת דירה 4', null);
  });
}

/* --- מצב הבניין --- */
SCREENS.estatus = () => {
  const counts={ok:0,help:0,danger:0,away:0,none:0};

  const totalPeople = APTS.reduce((s,a)=>s+(stOf(a.n)==='ok'?a.people:0),0);
  const openReqs = S.requests.filter(r=>r.status!=='טופלה').length;
  const openTasks = S.tasks.filter(t=>t.kind==='emg'&&t.status!=='done').length;
  const floors=[...new Set(APTS.map(a=>a.floor))].sort((a,b)=>b-a);
  return `<div class="stack-lg">
    <div class="row-between"><h2>מצב הבניין</h2><span class="small">עודכן ${nowHM()}</span></div>

      <div style="flex:1"><b>אתם: ${STATUS_META[S.myStatus].label}</b><div class="small">דירה ${S.onb.apt} · לעדכון — לחצו כאן</div></div>
    </button>`
    :`<button class="card row" style="width:100%; border-color:var(--orange); background:var(--orange-soft)" onclick="go('ereport')">
      <span style="color:var(--orange-ink)">${I.bell}</span>
      <b style="color:var(--orange-ink); flex:1">עוד לא דיווחתם — לחצו לדיווח מהיר</b>
    </button>`}

    <div class="counters">
      ${counter(counts.ok,'בסדר','st-ok')}
      ${counter(counts.help,'צריכים עזרה','st-help')}
      ${counter(counts.danger,'מצוקה','st-danger')}
      ${counter(counts.none,'לא דיווחו','st-none')}
      ${counter(counts.away,'לא בבניין','st-away')}
      ${counter(totalPeople,'נפשות בטוחות','st-away')}
    </div>

    <div class="card stack">
      <div class="row-between"><b>מפת הבניין</b><span class="small">לחיצה על דירה — פרטים</span></div>
      <div class="bmap">
        ${floors.map(f=>`<div class="floor-label">קומה ${f}</div>`+
          APTS.filter(a=>a.floor===f).map(a=>{
            const st=stOf(a.n), m=STATUS_META[st];
            return `<button class="bapt ${m.cls}" onclick="openApt(${a.n})" aria-label="דירה ${a.n}: ${m.label}">
              <span class="num">${a.n}${a.me?' ★':''}</span><span class="st">${m.label}</span></button>`;
          }).join('')).join('')}
      </div>
      <div class="row" style="flex-wrap:wrap; gap:6px">
        ${Object.entries(STATUS_META).map(([k,m])=>`<span class="tag ${m.tag}">${m.label}</span>`).join('')}
      </div>
    </div>

    <div class="grid2">
      <button class="card stack" style="gap:4px" onclick="go('erequests')"><b style="font-size:22px; font-variant-numeric:tabular-nums">${openReqs}</b><span class="small">בקשות פתוחות ←</span></button>
      <button class="card stack" style="gap:4px" onclick="go('etasks')"><b style="font-size:22px; font-variant-numeric:tabular-nums">${openTasks}</b><span class="small">משימות פתוחות ←</span></button>
    </div>

    ${S.coordinator?`<div class="card stack" style="border-color:var(--blue)">
      <b>ניהול האירוע (רכז)</b>
      <p class="small">כשכל הדירות מטופלות והבקשות סגורות — אפשר לסיים.</p>
      <button class="btn btn-primary" onclick="confirmEndEvent()">סיום האירוע והפקת סיכום</button>
    </div>`
    :`<p class="small center">ניהול מלא של האירוע זמין לרכז — אפשר להפעיל "תצוגת רכז" בפרופיל (בשגרה) או כאן: <button class="btn-quiet" onclick="S.coordinator=true;render()" style="padding:2px 6px">הפעלה להדגמה</button></p>`}
  </div>`;
};
const counter=(n,t,cls)=>`<div class="counter ${cls}"><div class="n">${n}</div><div class="t">${t}</div></div>`;

function openApt(n){
  const a=APTS.find(x=>x.n===n), st=stOf(n), m=STATUS_META[st];
  openModal(`<div class="stack-lg">
    <div class="row-between"><h2>דירה ${n} · קומה ${a.floor}</h2><span class="tag ${m.tag}">${m.icon} ${m.label}</span></div>

      <b>${esc(a.name)}${a.me?' (אתם)':''}</b>
      <div class="small">${a.people} נפשות${a.note?' · '+esc(a.note):''}</div>
      ${a.skills.length?`<div class="chips">${a.skills.map(s=>`<span class="tag tag-blue">${s}</span>`).join('')}</div>`:''}
      ${a.equip.length?`<div class="small">ציוד: ${a.equip.join(', ')}</div>`:''}
      ${a.needs?`<div class="card" style="background:var(--orange-soft); border-color:#EFCFA8; padding:10px"><span class="small" style="color:var(--orange-ink)"><b>צרכים מיוחדים:</b> ${esc(a.needs)}</span></div>`:''}
    </div>
    ${st==='none'&&!a.me?`<div class="stack">
      <button class="btn btn-primary" onclick="toast('חיוג ל${esc(a.name)}... (הדגמה)')">${I.phone} התקשרות</button>
      ${S.coordinator?`<button class="btn btn-ghost" onclick="assignCheckTask(${n})">שליחת מתנדב לבדיקה</button>`:''}
    </div>`:''}
    ${(st==='help'||st==='danger')&&!a.me&&S.coordinator?`<button class="btn btn-orange" onclick="closeModal();go('erequests')">לבקשת העזרה ←</button>`:''}
    <button class="btn-quiet" style="align-self:center" onclick="closeModal()">סגירה</button>
  </div>`);
}
function assignCheckTask(n){
  const a=APTS.find(x=>x.n===n);
  S.tasks.unshift({id:S.nextTask++, kind:'emg', title:`בדיקת דירה ${n} — ${a.name}`, sub:'טרם דיווחו. לדפוק בדלת ולוודא שהכול תקין.', status:'open', urgTag:'tag-orange', urg:'בהקדם'});
  closeModal(); toast(`נוצרה משימת בדיקה לדירה ${n}`); render();
}

/* --- בקשות --- */
SCREENS.erequests = () => {
  const reqs=S.requests;
  return `<div class="stack-lg">
    <h2>בקשות עזרה</h2>
    ${reqs.length? `<div class="stack">${reqs.map(reqCard).join('')}</div>`
    : `<div class="card center stack" style="padding:34px 16px">
        <span style="color:var(--green)">${IL('check')}</span><b>אין בקשות פתוחות</b>
        <p class="small">כרגע אף אחד בבניין לא ביקש עזרה. זה טוב.</p></div>`}
    ${S.myStatus!=='help'?`<button class="btn btn-orange" onclick="startHelp()">${I.hand} אנחנו צריכים עזרה</button>`:''}
  </div>`;
};
function reqCard(r){
  const closed=r.status==='טופלה';
  return `<div class="card stack" style="${closed?'opacity:.65':''}">
    <div class="row">
      <span class="avatar" style="background:var(--orange-soft);color:var(--orange-ink)">${initials(r.who)}</span>
      <div style="flex:1"><b>${esc(r.who)}</b> <span class="small">· דירה ${r.apt} · ${r.time}</span></div>
      <span class="tag ${r.urgTag}">${esc(r.urg)}</span>
    </div>
    <p style="font-size:15px">${esc(r.text)}</p>
    <div class="row-between">
      <span class="tag ${closed?'tag-green':r.assignee?'tag-blue':'tag-gray'}">${closed?I.check+' טופלה':esc(r.status)}${r.assignee&&!closed?' · '+esc(r.assignee.split('·')[0]):''}</span>
      ${!closed&&!r.assignee&&S.coordinator?`<button class="chip on" onclick="openAssign(${r.id})">הקצאת מתנדב</button>`:''}
      ${!closed&&!r.assignee&&!S.coordinator&&!r.mine?`<button class="chip" onclick="volunteerSelf(${r.id})">אני אטפל בזה</button>`:''}
      ${!closed&&r.assignee&&S.coordinator?`<button class="chip" onclick="closeReq(${r.id})">סימון כטופלה</button>`:''}
    </div>
  </div>`;
}
function volunteerSelf(id){
  const r=S.requests.find(x=>x.id===id); if(!r)return;
  r.assignee=`${S.onb.name} · דירה ${S.onb.apt}`; r.status='מתנדב בדרך';
  S.tasks.unshift({id:S.nextTask++, kind:'emg', reqId:id, title:`${r.type} — ${r.who}, דירה ${r.apt}`, sub:r.text, status:'open', urgTag:r.urgTag, urg:r.urg});
  logEv('התנדבות עצמית לבקשה');
  toast('קיבלתם על עצמכם את המשימה 💪 היא מחכה במסך המשימות', ()=>{r.assignee=null;r.status='התקבלה';S.tasks.shift();});
  render();
}
function openAssign(id){
  const r=S.requests.find(x=>x.id===id); if(!r)return;
  const need = r.type==='רפואי'?'עזרה ראשונה': r.type==='סיוע פיזי'?'הרמה וסחיבה': r.type==='תמיכה נפשית'?'תמיכה רגשית':null;
  const cands = APTS.filter(a=>!a.me&&a.n!==r.apt&&stOf(a.n)==='ok')
    .map(a=>{
      let score=0, why=[];
      if(need&&a.skills.includes(need)){score+=2; why.push(need);}
      if(a.skills.includes('עזרה ראשונה')&&r.type!=='רפואי'){score+=1;}
      const d=Math.abs(a.floor-APTS.find(x=>x.n===r.apt).floor);
      score+= (2-Math.min(d,2))*.5; why.push(d===0?'אותה קומה':`${d} קומות משם`);
      return {a,score,why};
    }).sort((x,y)=>y.score-x.score).slice(0,4);
  openModal(`<div class="stack-lg">
    <h2>מי הכי מתאים לעזור?</h2>
    <p class="sub">מיינו לפי מיומנות וקרבה. ההחלטה תמיד שלכם — לא של המערכת.</p>
    <div class="stack">${cands.map(c=>`<button class="card row" style="width:100%" onclick="assignTo(${id},${c.a.n})">
      <span class="avatar">${initials(c.a.name)}</span>
      <div style="flex:1"><b>${esc(c.a.name)}</b><div class="small">דירה ${c.a.n} · ${c.why.join(' · ')}</div></div>
      ${c.score>=2?'<span class="tag tag-green">התאמה גבוהה</span>':''}
    </button>`).join('')}</div>
    <button class="btn-quiet" style="align-self:center" onclick="closeModal()">ביטול</button>
  </div>`);
}
function assignTo(reqId, aptN){
  const r=S.requests.find(x=>x.id===reqId), a=APTS.find(x=>x.n===aptN);
  r.assignee=`${a.name} · דירה ${a.n}`; r.status='מתנדב בדרך';
  logEv(`הוקצה מתנדב: ${a.name}`);
  closeModal(); toast(`${a.name} קיבלו הודעה ויצאו לדרך`);
  if(r.mine){} render();
  sim(7000, ()=>{ if(r.status==='מתנדב בדרך'){r.status='בטיפול';} });
}
function closeReq(id){
  const r=S.requests.find(x=>x.id===id); if(!r)return;
  r.status='טופלה'; S.aptStatus[r.apt]='ok'; logEv('בקשה נסגרה');
  toast(`הבקשה של ${r.who} סומנה כטופלה ✓`); render();
}

/* --- משימות (חירום) --- */
SCREENS.etasks = () => {
  const tasks=S.tasks.filter(t=>t.kind==='emg');
  return `<div class="stack-lg">
    <h2>המשימות שלי</h2>
    <p class="sub">משימות שקיבלתם או לקחתם על עצמכם באירוע הנוכחי.</p>
    ${tasks.length? `<div class="stack">${tasks.map(taskCard).join('')}</div>`
    : `<div class="card center stack" style="padding:34px 16px">
        <span style="color:var(--ink-3)">${IL('tasks')}</span><b>אין משימות כרגע</b>
        <p class="small" style="max-width:250px">אפשר לעזור: במסך הבקשות לוחצים "אני אטפל בזה" על בקשה פתוחה.</p>
        <button class="btn btn-ghost" onclick="go('erequests')">לבקשות הפתוחות ←</button></div>`}
  </div>`;
};
function taskCard(t){
  const st=t.status;
  return `<div class="card stack" style="${st==='done'?'opacity:.65':''}">
    <div class="row-between"><b>${esc(t.title)}</b><span class="tag ${t.urgTag}">${esc(t.urg)}</span></div>
    <p class="small">${esc(t.sub)}</p>
    <div class="row">
      ${st==='open'?`<button class="btn btn-primary" style="min-height:46px; font-size:15px" onclick="taskGo(${t.id})">יוצאים לדרך</button>
        <button class="chip" onclick="taskDrop(${t.id})">לא יכולים</button>`:''}
      ${st==='going'?`<span class="tag tag-blue">בדרך…</span>
        <button class="btn btn-green" style="min-height:46px; font-size:15px" onclick="taskDone(${t.id})">${I.check} טופל</button>`:''}
      ${st==='done'?`<span class="tag tag-green">${I.check} הושלם — תודה!</span>`:''}
    </div>
  </div>`;
}
function taskGo(id){ const t=S.tasks.find(x=>x.id===id); t.status='going';
  if(t.reqId){const r=S.requests.find(x=>x.id===t.reqId); if(r)r.status='בטיפול';}
  toast('סימנו שאתם בדרך. השאר רואים את זה.'); render(); }
function taskDone(id){
  const t=S.tasks.find(x=>x.id===id); t.status='done'; logEv('משימה הושלמה: '+t.title);
  if(t.reqId){const r=S.requests.find(x=>x.id===t.reqId); if(r){r.status='טופלה'; S.aptStatus[r.apt]='ok';}}
  if(t.title.includes('דירה 4')){ S.aptStatus[4]='ok'; pushUpdate('דירה 4 נבדקה על ידי מתנדב — הכול תקין.'); }
  toast('כל הכבוד! המשימה הושלמה ✓'); render();
}
function taskDrop(id){ const t=S.tasks.find(x=>x.id===id);
  toast('בסדר גמור. המשימה חזרה לרכז לשיבוץ מחדש.', ()=>{S.tasks.unshift(t);render();});
  S.tasks=S.tasks.filter(x=>x.id!==id); render(); }

SCREENS.eupdates = () => `
<div class="stack-lg">
  <h2>עדכונים רשמיים</h2>

/* --- סיום אירוע וסיכום --- */
function confirmEndEvent(){
  const unre=APTS.filter(a=>stOf(a.n)==='none').length;
  const openR=S.requests.filter(r=>r.status!=='טופלה').length;
  openModal(`<div class="stack-lg">
    <h2>לסיים את האירוע?</h2>
    ${unre||openR?`<div class="card" style="background:var(--orange-soft); border-color:#EFCFA8">
      <b style="color:var(--orange-ink)">שימו לב:</b>
      <p class="small" style="color:var(--orange-ink)">${unre?`${unre} דירות עדיין לא דיווחו. `:''}${openR?`${openR} בקשות עדיין פתוחות.`:''}</p>
    </div>`:`<p class="sub">כל הדירות דיווחו וכל הבקשות טופלו. אפשר לסיים בראש שקט.</p>`}
    <p class="sub">כל הדיירים יקבלו הודעת סיום, והמערכת תפיק סיכום אירוע.</p>
    <button class="btn btn-primary" onclick="endEvent()">אישור סיום האירוע</button>
    <button class="btn-quiet" style="align-self:center" onclick="closeModal()">עוד לא</button>
  </div>`);
}
function endEvent(){
  closeModal();
  const counts={ok:0,help:0,danger:0,away:0,none:0};
  APTS.forEach(a=>counts[stOf(a.n)]++);
  S.summary={
    name:S.emgName, drill:S.drill, start:S.emgStart, end:nowHM(),
    reported: APTS.length-counts.none, total:APTS.length,
    reqs:S.requests.length, reqsDone:S.requests.filter(r=>r.status==='טופלה').length,
    tasksDone:S.tasks.filter(t=>t.kind==='emg'&&t.status==='done').length,
    tasksAll:S.tasks.filter(t=>t.kind==='emg').length,
    unreported: APTS.filter(a=>stOf(a.n)==='none').map(a=>`דירה ${a.n} (${a.name})`),
  };
  S.simTimers.forEach(clearTimeout); S.simTimers=[];
  S.mode='routine'; S.myStatus=null;
  S.posts.unshift({id:S.nextPost++, who:'ועד הבניין', apt:'', cat:'הודעה', catTag:'tag-blue', official:true, time:'עכשיו',
    text:`${S.drill?'תרגיל':'אירוע'} ה${S.summary.name} הסתיים. תודה לכל מי שדיווח ועזר — סיכום מלא נשלח לכולם.`, act:'לצפייה בסיכום', done:false});
  go('summary');
}
SCREENS.summary = () => {
  const s=S.summary; if(!s) return SCREENS.home();
  const pct=Math.round(s.reported/s.total*100);
  return `<div class="stack-lg">
    <div class="center stack" style="gap:6px; padding-top:10px">
      <div style="width:74px;height:74px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center">${IL('check')}</div>
      <h1 style="font-size:23px">האירוע הסתיים</h1>
      <p class="sub">${s.drill?'תרגיל':'אירוע'} ${esc(s.name)} · ${s.start}–${s.end}</p>
    </div>
    <div class="counters" style="grid-template-columns:1fr 1fr">
      ${counter(pct+'%','מהדירות דיווחו','st-ok')}
      ${counter(s.reqsDone+'/'+s.reqs,'בקשות טופלו','st-help')}
      ${counter(s.tasksDone+'/'+s.tasksAll,'משימות הושלמו','st-away')}
      ${counter(s.total-s.reported,'דירות ללא דיווח','st-none')}
    </div>
    ${s.unreported.length?`<div class="card stack">
      <b>לתשומת לב הוועד</b>
      <p class="small">לא התקבל דיווח מ: ${s.unreported.join(', ')}. מומלץ לוודא שהכול בסדר ולעדכן פרטי קשר.</p>
    </div>`:''}
    <div class="card stack">
      <b>המלצות לשיפור</b>
      <ul style="padding-inline-start:18px; font-size:14.5px; color:var(--ink-2); display:flex; flex-direction:column; gap:6px">
        <li>לצרף את הדירות שטרם נרשמו לאפליקציה — כל דירה רשומה מקצרת את זמן התגובה.</li>
        <li>למנות אחראי קומה לכל קומה, לבדיקה פיזית מהירה של מי שלא דיווח.</li>
        <li>לקבוע תרגיל מוכנות פעמיים בשנה. הבניין שדיווח היום ב־${pct}% — ישתפר.</li>
      </ul>
    </div>
    <button class="btn btn-primary" onclick="go('home')">חזרה לשגרה</button>
  </div>`;
};

/* התחלה */
render();
</script>
